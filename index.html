<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>شروحات</title>
<style>
:root{--white:#f7f7f7;--black:#030303;--gray:#6f6f6f;--silver:#c7c7c7;--radius:24px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--white);background:radial-gradient(circle at top,rgba(255,255,255,.07),transparent 32%),var(--black);overflow-x:hidden;direction:rtl;text-align:right}
body::before,body::after{content:"";position:fixed;inset:-10%;pointer-events:none;z-index:0}
body::before{background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.1),transparent 24%),radial-gradient(circle at 80% 10%,rgba(255,255,255,.06),transparent 16%),radial-gradient(circle at 50% 80%,rgba(255,255,255,.07),transparent 24%);filter:blur(24px)}
body::after{background:radial-gradient(circle,rgba(255,255,255,.04),transparent 45%);mix-blend-mode:screen;filter:blur(40px)}
#spaceCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.95}
.vignette{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at center,transparent 0%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.app-shell{position:relative;z-index:2;min-height:100vh;padding:36px 24px 70px;max-width:1380px;margin:0 auto}
.hero{text-align:center;padding:24px 0 20px}
.brand{display:inline-flex;flex-direction:column;gap:10px;align-items:center;padding:16px 28px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 0 20px rgba(255,255,255,.03)}
.brand-mark{font-size:.76rem;letter-spacing:.45em;text-transform:uppercase;color:var(--silver)}
.brand-title{font-size:clamp(2rem,4vw,3.1rem);font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin:0}
.brand-subtitle{font-size:.93rem;color:var(--silver);letter-spacing:.2em;text-transform:uppercase}
.search-wrap{max-width:760px;margin:28px auto 38px}
.search-bar{position:relative;display:flex;align-items:center;gap:12px;border-radius:999px;padding:16px 20px;background:rgba(255,255,255,.07);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.24);overflow:hidden}
.search-bar::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent 20%,rgba(255,255,255,.08) 65%,transparent);transform:translateX(-100%);transition:transform .9s ease}
.search-bar:hover::before{transform:translateX(100%)}
.search-icon{font-size:1.05rem;color:var(--silver)}
.search-bar input{flex:1;border:none;outline:none;background:transparent;color:var(--white);font-size:1rem;padding:2px 0}
.search-bar input::placeholder{color:rgba(255,255,255,.55)}
.games-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.game-card{position:relative;padding:16px;border-radius:var(--radius);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);box-shadow:0 16px 40px rgba(0,0,0,.28);cursor:pointer;transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease}
.game-card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 16px 40px rgba(0,0,0,.36)}
.game-card:hover .card-image{transform:scale(1.01)}
.game-card:hover .glow-dot{transform:scale(1.04);opacity:.9}
.card-image{width:100%;height:230px;border-radius:18px;object-fit:cover;transition:transform .4s ease}
.card-content{padding:16px 4px 4px}
.card-title{font-size:1.18rem;margin:0 0 10px;font-weight:700;letter-spacing:.04em}
.card-meta{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.68);font-size:.9rem;margin-top:8px}
.glow-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--white),var(--gray));box-shadow:0 0 20px rgba(255,255,255,.35)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:28px;z-index:10;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-panel{width:min(1180px,100%);max-height:90vh;overflow-y:auto;overflow-x:hidden;border-radius:30px;padding:28px;position:relative;background:rgba(10,10,10,.78);border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 40px rgba(0,0,0,.28);transform:scale(.98);opacity:0;transition:transform .2s ease,opacity .2s ease;backdrop-filter:blur(10px)}
.modal-overlay.show .modal-panel{transform:scale(1);opacity:1}
.modal-close{position:absolute;top:20px;right:20px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--white);cursor:pointer;font-size:1rem}
.modal-content{display:grid;grid-template-columns:1.04fr .96fr;gap:24px;align-items:start}
.modal-artwork{position:relative;padding:14px;border-radius:28px;background:linear-gradient(140deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);overflow:hidden}
.modal-artwork img{width:100%;border-radius:22px;display:block}
.modal-stack{display:grid;gap:18px}
.glass-card{border-radius:24px;padding:20px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.22);position:relative;overflow:hidden}
.glass-card h3{font-size:1.06rem;letter-spacing:.22em;text-transform:uppercase;margin:0 0 16px;color:var(--silver)}
.download-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:8px 4px 8px 0;padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:var(--white);text-decoration:none;font-weight:700;transition:transform .25s ease,background .25s ease;font-size:.9rem}
.download-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
.download-note{font-size:.88rem;color:var(--silver);margin:4px 0 10px}
.download-actions{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.accordion-list{display:grid;gap:10px}
.accordion-item{width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:16px;padding:13px 15px;color:var(--white);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:transform .18s ease,border-color .18s ease}
.accordion-item:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.26)}
.accordion-title{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.04em}
.accordion-icon{width:28px;height:28px;border-radius:999px;display:inline-grid;place-items:center;font-size:.9rem;border:1px solid rgba(255,255,255,.16);color:var(--silver)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .5s ease,margin-top .35s ease,opacity .35s ease;opacity:0;margin-top:0}
.accordion-body.open{max-height:5000px;opacity:1;margin-top:8px}
.content-block{margin:0;padding:12px 14px;border-radius:14px;color:rgba(255,255,255,.72);background:rgba(255,255,255,.04);line-height:1.7;border:1px solid rgba(255,255,255,.1);overflow:hidden}
.content-block ul{margin:0;padding-right:18px}
.content-block li{margin-bottom:8px}
.content-block p{margin:0 0 8px}
.content-block pre{direction:ltr;text-align:left;background:rgba(0,0,0,.3);padding:10px 14px;border-radius:10px;overflow-x:auto;font-family:"Cascadia Code","Consolas",monospace;font-size:.85rem;color:#e0e0e0;border:1px solid rgba(255,255,255,.08);margin:8px 0;white-space:pre;max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:960px){.games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.modal-content{grid-template-columns:1fr}}
@media(max-width:640px){.app-shell{padding:20px 15px 60px}.games-grid{grid-template-columns:1fr}.brand{padding:14px 18px}.search-bar{padding:14px 16px}.modal-panel{padding:20px}}
</style>
</head>

const grid=document.getElementById('gamesGrid'),searchInput=document.getElementById('searchInput'),overlay=document.getElementById('modalOverlay'),closeBtn=document.getElementById('modalClose'),modalArtwork=document.getElementById('modalArtwork'),modalTitle=document.getElementById('modalTitle'),guideAccordion=document.getElementById('guideAccordion'),downloadActions=document.getElementById('downloadActions'),canvas=document.getElementById('spaceCanvas'),ctx=canvas.getContext('2d');
function renderCards(f){const q=(f||'').trim().toLowerCase();const v=ALLGAMES.filter(g=>(g.title+' '+g.category).toLowerCase().includes(q));grid.innerHTML=v.map(cardMarkup).join('');attachCardInteractions()}
function cardMarkup(g){return '<article class="game-card" data-id="'+g.id+'"><img class="card-image" src="'+g.image+'" alt="'+g.title+' artwork"/><div class="card-content"><h2 class="card-title">'+g.title+'</h2><div class="card-meta"><span>دليل احترافي</span><span class="glow-dot"></span></div></div></article>'}
function attachCardInteractions(){document.querySelectorAll('.game-card').forEach(c=>{c.addEventListener('click',()=>openModal(+c.dataset.id));c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width;const y=(e.clientY-r.top)/r.height;c.style.transform='perspective(900px) rotateX('+(.5-y)*8+'deg) rotateY('+(x-.5)*8+'deg) translateY(-10px) scale(1.02)'});c.addEventListener('mouseleave',()=>{c.style.transform=''})})}
function renderDownloadArea(g){const u=(g.downloadUrl||'').trim();if(!u){downloadActions.innerHTML='';return}const note=g.downloadNote?(g.requiresSubscription?'يجب أن يكون لديك اشتراك نشط للتحميل. ':'')+'<p class="download-note">'+g.downloadNote+'</p>':(g.requiresSubscription?'<p class="download-note">يجب أن يكون لديك اشتراك نشط للتحميل.</p>':'<p class="download-note">يمكنك البدء بالتحميل مباشرة.</p>');downloadActions.innerHTML='<a class="download-btn" href="'+u+'" target="_blank" rel="noopener">⬇ '+g.downloadLabel+'</a>'+note}
function renderGuide(g){renderDownloadArea(g);guideAccordion.innerHTML=g.sections.map(s=>'<div class="accordion-item" data-target="'+s.key+'"><span class="accordion-title"><span class="accordion-icon">'+s.icon+'</span>'+s.title+'</span><span>▾</span></div><div class="accordion-body" id="'+s.key+'">'+s.body+'</div>').join('');guideAccordion.querySelectorAll('.accordion-item').forEach(i=>{i.addEventListener('click',()=>{const t=document.getElementById(i.dataset.target);const o=t.classList.contains('open');guideAccordion.querySelectorAll('.accordion-body').forEach(b=>b.classList.remove('open'));if(!o)t.classList.add('open')})})}
function openModal(id){const g=ALLGAMES.find(x=>x.id===id);if(!g)return;modalTitle.textContent=g.title;modalArtwork.src=g.image;renderGuide(g);overlay.classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){overlay.classList.remove('show');document.body.style.overflow=''}
closeBtn.addEventListener('click',closeModal);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
searchInput.addEventListener('input',e=>renderCards(e.target.value));
function createArtwork(t){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#060606"/><rect x="70" y="70" width="1060" height="660" rx="40" fill="url(%23g1)"/><circle cx="940" cy="220" r="120" fill="#f7f7f7" fill-opacity="0.08"/><circle cx="760" cy="560" r="180" fill="#c7c7c7" fill-opacity="0.08"/><text x="140" y="690" font-family="Segoe UI,Arial" font-size="42" fill="#f7f7f7" letter-spacing="4">'+t.toUpperCase()+'</text><text x="140" y="735" font-family="Segoe UI,Arial" font-size="24" fill="#c7c7c7" letter-spacing="5">CINEMATIC GUIDE</text><defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#171717"/><stop offset="65%" stop-color="#090909"/><stop offset="100%" stop-color="#222222"/></linearGradient></defs></svg>')}
function resizeCanvas(){canvas.width=Math.floor(window.innerWidth);canvas.height=Math.floor(window.innerHeight);ctx.setTransform(1,0,0,1,0,0)}
const stars=Array.from({length:70},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.1+.2,a:Math.random()*.6+.15}));
const nebulae=Array.from({length:3},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,radius:Math.random()*180+120,alpha:Math.random()*.04+.02}));
function drawBackground(){resizeCanvas();const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);const g=ctx.createRadialGradient(w*.3,h*.2,0,w*.3,h*.2,h*.75);g.addColorStop(0,'#0a0a0a');g.addColorStop(1,'#030303');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);nebulae.forEach(n=>{const gl=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.radius);gl.addColorStop(0,'rgba(255,255,255,'+n.alpha+')');gl.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(n.x,n.y,n.radius,0,Math.PI*2);ctx.fill()});const t=performance.now()*.00003;stars.forEach(s=>{const dx=Math.sin(t+s.x*.001)*.18;const dy=Math.cos(t*.8+s.y*.001)*.12;const x=s.x+dx*18;const y=s.y+dy*18;ctx.beginPath();ctx.arc(x,y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(247,247,247,'+(s.a+.2*Math.sin(t*2+s.x))+')';ctx.fill();if(s.r>.8){ctx.beginPath();ctx.arc(x,y,s.r*2.5,0,Math.PI*2);ctx.strokeStyle='rgba(199,199,199,'+(.05+s.a*.08)+')';ctx.stroke()}})}
function animateBackground(){drawBackground();requestAnimationFrame(animateBackground)}
window.addEventListener('resize',drawBackground);animateBackground();renderCards();
</script>
